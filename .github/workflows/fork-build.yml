# Builds and tests any branch of this fork: Linux, Windows, Android and the Mac app,
# plus the JellyfinKit tests. iPhone, iPad and Apple TV are checked by hand in Xcode.
#
# **Fork only.** This file lives on the fork's `main` and is not part of any pull
# request to the upstream project. It is started by hand (Actions → Fork build →
# Run workflow) with the branch to build; the branch itself does not need this file.
#
# **Nothing is signed or published.** Every result is uploaded as an artifact of
# the run: test results, a Linux tarball, a Windows folder, an Android debug APK, an
# unsigned Mac app.
#
# The upstream build scripts carry paths from the maintainer's machines
# (`C:\Werkzeuge`, `C:\Swift`, `~/Library/...`). The jobs below recreate those paths
# with links or adjust them inside the run; the repository files stay unchanged.

name: Fork build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
      linux:
        description: Linux
        type: boolean
        default: true
      windows:
        description: Windows
        type: boolean
        default: true
      android:
        description: Android
        type: boolean
        default: true
      macos:
        description: macOS
        type: boolean
        default: true

concurrency:
  group: fork-build-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: JellyfinKit — tests
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }

      - name: swift test
        working-directory: Packages/JellyfinKit
        run: swift test --parallel --xunit-output "$GITHUB_WORKSPACE/test-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jellyfinkit-tests
          path: test-results*.xml
          if-no-files-found: warn

  linux:
    name: Linux — build
    if: inputs.linux
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libvlc-dev pkg-config g++ git ca-certificates

      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }

      # Same steps as linux-packages.yml, without packaging, signing and publishing.
      - name: rlottie
        run: |
          export SWIFTLY_RLOTTIE_ZIEL="$PWD/.rlottie"
          bash Werkzeuge/rlottie-build.sh "$PWD/.rlottie-quelle"

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$PWD/.rlottie/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          mkdir -p Linux/Resources/Licenses && cp LICENSES/* Linux/Resources/Licenses/
          cd Linux
          swift build -c release -Xswiftc -static-stdlib
          echo "BUILD_DIR=$(swift build -c release -Xswiftc -static-stdlib --show-bin-path)" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          mkdir -p out/swiftly-linux
          cp "$BUILD_DIR/SwiftlyLinux" out/swiftly-linux/
          cp -R "$BUILD_DIR"/*.resources out/swiftly-linux/ 2>/dev/null || true
          tar -C out -czf swiftly-linux-x86_64.tar.gz swiftly-linux

      - uses: actions/upload-artifact@v5
        with:
          name: swiftly-linux-x86_64
          path: swiftly-linux-x86_64.tar.gz

  windows:
    name: Windows — build
    if: inputs.windows
    runs-on: windows-2022
    env:
      SWIFT_VERSION: "6.2.1"
      VLC_VERSION: "3.0.21"
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }

      # build.ps1 and rlottie-build.ps1 expect the repository at C:\swiftly and the
      # tools under C:\Werkzeuge and C:\Swift.
      - name: Paths of the build scripts
        run: |
          New-Item -ItemType Junction -Path C:\swiftly -Target $env:GITHUB_WORKSPACE | Out-Null
          New-Item -ItemType Directory -Force -Path C:\Werkzeuge | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $buildTools = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools'
          if (-not (Test-Path $buildTools)) { New-Item -ItemType Junction -Path $buildTools -Target $vs | Out-Null }

      - name: Swift
        run: |
          $url = "https://download.swift.org/swift-$env:SWIFT_VERSION-release/windows10/swift-$env:SWIFT_VERSION-RELEASE/swift-$env:SWIFT_VERSION-RELEASE-windows10.exe"
          Invoke-WebRequest $url -OutFile swift.exe
          Start-Process -Wait -FilePath .\swift.exe -ArgumentList '/quiet', '/norestart'
          # Wherever the installer put it, environment.ps1 looks under C:\Swift.
          $toolchains = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs", $env:ProgramFiles, 'C:\Library' `
                          -Directory -Recurse -Filter Toolchains -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $toolchains) { throw 'Swift toolchain not found after installation' }
          if (-not (Test-Path C:\Swift)) { New-Item -ItemType Junction -Path C:\Swift -Target $toolchains.Parent.FullName | Out-Null }
          Get-ChildItem C:\Swift

      - name: GTK 4 (gvsbuild)
        run: |
          $asset = gh release view --repo wingtk/gvsbuild --json assets --jq '.assets[].name' |
                   Where-Object { $_ -match '^GTK4_Gvsbuild_.*_x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'No GTK4 x64 asset in the latest gvsbuild release' }
          gh release download --repo wingtk/gvsbuild --pattern $asset --output gtk4.zip
          Expand-Archive gtk4.zip -DestinationPath C:\Werkzeuge\gtk4

      - name: libVLC
        run: |
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.7z" -OutFile vlc.7z
          7z x vlc.7z -oC:\Werkzeuge\vlc | Out-Null
          Get-ChildItem C:\Werkzeuge\vlc

      - name: rlottie
        run: .\Werkzeuge\rlottie-build.ps1

      - name: Build
        run: |
          .\Windows\build.ps1 -Konfiguration release `
            -Gtk C:\Werkzeuge\gtk4 `
            -Vlc "C:\Werkzeuge\vlc\vlc-$env:VLC_VERSION\sdk" `
            -VlcLaufzeit "C:\Werkzeuge\vlc\vlc-$env:VLC_VERSION" `
            -SwiftLaufzeit "C:\Swift\Runtimes\$env:SWIFT_VERSION\usr\bin" `
            -Rlottie C:\Werkzeuge\rlottie

      - name: Build log
        if: failure()
        run: |
          if (Test-Path Windows\bau.log) { Get-Content Windows\bau.log -Tail 200 }
          if (Test-Path C:\Werkzeuge\rlottie.log) { Get-Content C:\Werkzeuge\rlottie.log -Tail 50 }

      - uses: actions/upload-artifact@v5
        with:
          name: swiftly-windows-x64
          path: |
            Windows/.build/release/*.exe
            Windows/.build/release/*.dll
            Windows/.build/release/*.resources/**
            Windows/.build/release/lib/**
            Windows/.build/release/share/**
            Windows/.build/release/plugins/**
            Windows/.build/release/Lizenzen/**
            Windows/.build/launcher/Swiftly.exe
          if-no-files-found: error

  android:
    name: Android — build and unit tests
    if: inputs.android
    runs-on: macos-15
    env:
      SWIFT_VERSION: "6.3.3"
      SWIFT_JAVA_VERSION: "0.6.0"
      NDK_VERSION: "27.3.13750724"
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }

      - name: JDK 25 (swiftkit-core) and JDK 21 (app)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          # core/build.gradle reads the SDK from ~/Library/Android/sdk.
          if [ "$ANDROID_HOME" != "$HOME/Library/Android/sdk" ]; then
            mkdir -p "$HOME/Library/Android"
            ln -sfn "$ANDROID_HOME" "$HOME/Library/Android/sdk"
          fi
          echo "ANDROID_NDK_HOME=$HOME/Library/Android/sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Swift and the Swift SDK for Android
        run: |
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          ~/.swiftly/bin/swiftly install --assume-yes "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          bundle="swift-$SWIFT_VERSION-RELEASE_android.artifactbundle"
          curl -fsSL "https://download.swift.org/swift-$SWIFT_VERSION-release/android-sdk/swift-$SWIFT_VERSION-RELEASE/$bundle.tar.gz" -o android-sdk.tar.gz
          ~/.swiftly/bin/swiftly run swift sdk install "$PWD/android-sdk.tar.gz" "+$SWIFT_VERSION"
          # Links the SDK to the NDK (sysroot and libc++).
          setup=$(find "$HOME/Library/org.swift.swiftpm/swift-sdks/$bundle" -name 'setup-android-sdk.sh' | head -1)
          [ -n "$setup" ] && bash "$setup"
          ~/.swiftly/bin/swiftly run swift sdk list "+$SWIFT_VERSION"

      - name: swiftkit-core into mavenLocal
        run: |
          git clone --depth 1 --branch "$SWIFT_JAVA_VERSION" https://github.com/swiftlang/swift-java.git "$RUNNER_TEMP/swift-java"
          cd "$RUNNER_TEMP/swift-java"
          JAVA_HOME="$JAVA_HOME_25_ARM64" ./gradlew :SwiftKitCore:publishToMavenLocal --no-daemon

      # core/build.gradle pins the macOS SDK of the maintainer's machine.
      - name: macOS SDK path for the Swift build
        run: |
          sed -i '' "s|/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk|$(xcrun --sdk macosx --show-sdk-path)|" Android/core/build.gradle

      - name: Build (direct, debug)
        working-directory: Android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_ARM64 }}
        run: ./gradlew :phone:assembleDirectDebug --no-daemon --stacktrace

      - name: Unit tests
        working-directory: Android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_ARM64 }}
        run: ./gradlew :phone:testDirectDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: swiftly-android-direct-debug
          path: Android/phone/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-tests
          path: Android/phone/build/reports/tests/
          if-no-files-found: warn

  macos:
    name: macOS — build
    if: inputs.macos
    # The project needs Xcode 26 or newer; macos-15 images ship older ones.
    runs-on: macos-26
    env:
      VLCKIT_URL: https://download.videolan.org/cocoapods/unstable/VLCKit-4.0-20260805-1123.zip
      VLCKIT_SHA: c0c3ae1665053db5898581efc8ee920f526643526297f7fc643599532dc2ccf5
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }

      - name: Newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # VLCKit is 2 GB unpacked and not in the repository (Werkzeuge/vlckit-fetch.sh). The
      # archive is cached by its checksum so later runs skip the download.
      - name: VLCKit archive (cached)
        id: vlckit
        uses: actions/cache@v4
        with:
          path: ~/vlckit.zip
          key: vlckit-${{ env.VLCKIT_SHA }}

      - name: VLCKit download
        if: steps.vlckit.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 5 -o ~/vlckit.zip "$VLCKIT_URL"

      # project.yml links the maintainer's patched build (`VLCKit-gepatcht`); the official
      # one stands in for it, as on a contributor's machine.
      - name: VLCKit into Vendor
        run: |
          echo "$VLCKIT_SHA  $HOME/vlckit.zip" | shasum -a 256 -c -
          unzip -q ~/vlckit.zip -d "$RUNNER_TEMP/vlckit"
          mkdir -p Vendor
          mv "$RUNNER_TEMP/vlckit/VLCKit.xcframework" Vendor/
          ln -sfn VLCKit.xcframework Vendor/VLCKit-gepatcht.xcframework

      - name: Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Swiftly.xcodeproj -scheme Swiftly-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*\.swift|BUILD" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: Build log
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -40 || true

      - name: Pack
        run: |
          app=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$app" Swiftly-macOS.zip

      - uses: actions/upload-artifact@v5
        with:
          name: swiftly-macos-unsigned
          path: Swiftly-macOS.zip
          if-no-files-found: error
